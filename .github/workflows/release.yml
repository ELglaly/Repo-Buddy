name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release artifacts
        run: ./gradlew test verifyRelease verifyPluginProjectConfiguration verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: repobuddy-${{ github.ref_name }}
          path: |
            build/distributions/repobuddy-plugin-*.zip
            build/distributions/repobuddy-cli-*.zip
            build/distributions/SHA256SUMS
          if-no-files-found: error
